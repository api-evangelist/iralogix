apis:
- name: IRALOGIX Partner Authorization Server
  description: 'The publicly reachable OpenID Connect / OAuth 2.0 authorization server
    that fronts the IRALOGIX partner platform. It publishes a full OIDC discovery document
    at /.well-known/openid-configuration and an RFC 8414 authorization-server metadata
    document, exposing authorization, token, device-code, userinfo, MFA challenge,
    JWKS, dynamic client registration, revocation and RP-initiated logout endpoints.
    It is the only IRALOGIX API surface that is machine-readable without partner credentials;
    the partner data APIs themselves are gated.'
  humanURL: https://partner.iralogix.com/
