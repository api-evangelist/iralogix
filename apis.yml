aid: iralogix
name: IRALOGIX
description: 'IRALOGIX is a Pittsburgh, Pennsylvania fintech that operates a cloud-native,
  white-label IRA (Individual Retirement Account) recordkeeping and administration
  platform for financial institutions — banks, wealth managers, brokerages, recordkeepers
  and advisors — who use it to offer digital IRA programs under their own brand. The
  platform covers onboarding, contributions, trading, distributions, rollovers, compliance
  monitoring and administration end to end, and the company markets "API-driven connectivity
  and real-time data flows" that integrate with existing custodial and recordkeeping
  infrastructure rather than replacing it. The developer surface is partner-gated:
  documentation at docs.iralogix.com sits behind Okta visitor authentication and the
  partner console at partner.iralogix.com behind an Auth0 tenant, so no public OpenAPI,
  AsyncAPI or SDK is published. The company states SSAE SOC 2 Type 1 and SSAE SOC 1
  Type 2 attestation.'
